{% if page.layout == 'article' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ page.title | jsonify }},
  "description": {{ page.description | jsonify }},
  "url": {{ page.url | absolute_url | jsonify }},
  "mainEntityOfPage": {{ page.url | absolute_url | jsonify }},
  "datePublished": {{ page.date | date_to_xmlschema | jsonify }},
  "dateModified": {{ page.last_modified_at | default: page.date | date_to_xmlschema | jsonify }},
  "inLanguage": "pt-BR",
  "image": {{ page.image | absolute_url | jsonify }},
  "author": { "@type": "Person", "name": {{ page.author | default: site.author | jsonify }} },
  "publisher": { "@type": "Organization", "name": {{ site.title | jsonify }} },
  "isAccessibleForFree": true
}
</script>
{% elsif page.article_index %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "CollectionPage",
  "name": {{ page.title | jsonify }},
  "description": {{ page.description | jsonify }},
  "url": {{ page.url | absolute_url | jsonify }},
  "inLanguage": "pt-BR"
}
</script>
{% else %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareSourceCode",
  "name": "{{ site.title | escape }}",
  "description": "{{ site.description | strip_newlines | escape }}",
  "url": "{{ '/' | absolute_url }}",
  "codeRepository": "https://github.com/carlosdelfino/calculadora-rtc-regime-regular-node",
  "programmingLanguage": ["JavaScript", "TypeScript"],
  "runtimePlatform": "Node.js 22",
  "license": "https://opensource.org/licenses/MIT",
  "author": {
    "@type": "Person",
    "name": "{{ site.author | escape }}",
    "email": "consultoria@carlosdelfino.eti.br",
    "url": "https://rapport.tec.br"
  },
  "isBasedOn": "https://github.com/ReceitaFederal/calculadora-rtc-regime-regular"
}
</script>
{% endif %}
