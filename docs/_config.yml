title: Calculadora RTC — Regime Regular
description: >-
  Calculadora da Reforma Tributária do Consumo (IBS, CBS e Imposto Seletivo)
  para o Regime Regular. Port Node.js do projeto Java da Receita Federal.
lang: pt-BR
remote_theme: zerostaticthemes/jekyll-serif-theme
author: Carlos Delfino
url: https://carlosdelfino.github.io
baseurl: /calculadora-rtc-regime-regular-node

logo:
  mobile: images/logo/logo-mobile.svg
  mobile_height: 40px
  mobile_width: 40px
  desktop: images/logo/logo.svg
  desktop_height: 48px
  desktop_width: 244px

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - ASSETS.md

header_pages:
  - index.md

markdown: kramdown
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
